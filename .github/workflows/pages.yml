name: Deploy research dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - virtue-pragmatics-active-inference
    paths:
      - notebooks/RESEARCH_DASHBOARD.html
      - notebooks/where_we_are.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble public site
        shell: bash
        run: |
          mkdir -p _site
          cp notebooks/RESEARCH_DASHBOARD.html _site/index.html
          cp notebooks/where_we_are.html _site/where-we-are.html
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
